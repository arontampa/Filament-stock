
<div class="charm l">🌙</div>
<div class="charm r">🏮</div>
<div class="frame">
  <div id="login">
    <h1>✦ Celestial Filament ✦</h1>
    <div class="zodiac-wheel">♈♉♊♋♌♍♎♏♐♑♒♓</div>
    <p>Sign in to sync your stars</p>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button>✦ Sign In ✦</button>
  </div>
  <div id="app" style="display:none">
    <h1>✦ Celestial Filament ✦</h1>
    <div class="zodiac-wheel">♈♉♊♋♌♍♎♏♐♑♒♓</div>
    <div id="user"></div>
    <input id="search" type="text" placeholder="🔍 Search the constellation...">
    <h3>✧ Inventory (<span id="count">0</span> shown)</h3>
    <div id="inventory"><div id="list"></div></div>
    <h3>✧ Add Manually</h3>
    <div id="addbar">
      <input id="nBrand" type="text" placeholder="Brand">
      <input id="nColor" type="text" placeholder="Color name">
      <button>✨ Add Item</button>
    </div>
    <h3>✧ Tools</h3>
    <input type="file" accept=".csv">
    <br>
    <button class="blue">📤 Share List</button>
    <button class="blue">💾 Backup CSV</button>
    <button class="blue">🔒 Sign Out</button>
  </div>
</div>
