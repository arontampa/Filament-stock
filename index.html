<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0620">
<title>Zodiac Shadows Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --void:#07040f;
    --deep:#120a2c;
    --lilac:#c9b8ff;
    --ice:#bfe9ff;
    --gold:#ffd88a;
    --rose:#ff9ecb;
    --aqua:#7ef0e0;
    --text:#efe9ff;
    --muted:#a99cd8;
  }

  *{box-sizing:border-box}

  body{
    font-family:"Quicksand","Segoe UI",system-ui,sans-serif;
    margin:0;
    padding:14px;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 50% -15%, #2a1a5e 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #14324a 0%, transparent 55%),
      radial-gradient(700px 500px at -10% 85%, #3a1350 0%, transparent 60%),
      linear-gradient(170deg, #0a0620 0%, #120a2c 35%, #0c0724 70%, #07040f 100%);
    background-attachment:fixed;
  }

  /* ── starfield ───────────────────────────────────────── */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 22px 34px, #ffffff, transparent 60%),
      radial-gradient(1px 1px at 92px 118px, #cfe8ff, transparent 60%),
      radial-gradient(1.6px 1.6px at 168px 62px, #ffe9b8, transparent 60%),
      radial-gradient(1px 1px at 224px 172px, #ffffff, transparent 60%),
      radial-gradient(1px 1px at 48px 206px, #e0d4ff, transparent 60%),
      radial-gradient(1.4px 1.4px at 268px 22px, #b9e8ff, transparent 60%),
      radial-gradient(1px 1px at 140px 250px, #ffd6ec, transparent 60%),
      radial-gradient(1.2px 1.2px at 292px 268px, #ffffff, transparent 60%);
    background-size:320px 320px;
    background-repeat:repeat;
    opacity:.6;
    animation:twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.32} to{opacity:.85} }

  /* ── faceted light wash ──────────────────────────────── */
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      conic-gradient(from 210deg at 15% -5%,
        rgba(255,255,255,.07), transparent 22%,
        rgba(255,158,203,.05) 42%, transparent 58%,
        rgba(126,240,224,.05) 78%, transparent 100%),
      radial-gradient(1200px 600px at 50% -10%, rgba(201,184,255,.18), transparent 60%),
      radial-gradient(900px 500px at 92% 112%, rgba(126,240,224,.10), transparent 60%);
  }

  #login,#app{position:relative; z-index:1}

  /* ── headings ────────────────────────────────────────── */
  h1{
    font-family:"Cinzel",Georgia,serif;
    font-size:1.25em;
    letter-spacing:.09em;
    margin:.4em 0 .2em;
    background:linear-gradient(92deg,#ffd88a 0%,#c9b8ff 34%,#7ef0e0 66%,#ff9ecb 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 14px rgba(201,184,255,.35));
  }
  h1::before,h1::after{
    color:var(--gold);
    font-size:.75em;
    vertical-align:middle;
    margin:0 .4em;
    opacity:.85;
  }
  h1::before{content:"✦"}
  h1::after{content:"✦"}

  h3{
    font-family:"Cinzel",Georgia,serif;
    font-size:.86em;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--lilac);
    margin:22px 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(201,184,255,.18);
    text-shadow:0 0 16px rgba(201,184,255,.35);
  }

  /* ── gem buttons ─────────────────────────────────────── */
  button{
    position:relative;
    overflow:hidden;
    padding:11px 16px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:13px;
    font-family:inherit;
    font-size:1em;
    font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    cursor:pointer;
    margin:4px 2px;
    background:linear-gradient(150deg,#5b3ec8 0%,#2a1a63 52%,#40268f 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -3px 8px rgba(0,0,0,.5),
      0 6px 20px rgba(91,62,200,.38);
    transition:transform .12s ease, box-shadow .25s ease, filter .2s ease;
  }
  button::after{
    content:"";
    position:absolute; top:-60%; left:-130%;
    width:55%; height:230%;
    background:linear-gradient(75deg,transparent,rgba(255,255,255,.7),transparent);
    transform:rotate(18deg);
    transition:left .6s cubic-bezier(.3,.7,.4,1);
    pointer-events:none;
  }
  button:hover::after{left:135%}
  button:hover{
    transform:translateY(-1px);
    filter:brightness(1.1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -3px 8px rgba(0,0,0,.5),
      0 10px 26px rgba(126,240,224,.28);
  }
  button:active{transform:translateY(1px) scale(.99)}

  .blue{
    background:linear-gradient(150deg,#4b3bb8 0%,#241a5e 55%,#3b2a91 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -3px 8px rgba(0,0,0,.5),
      0 6px 20px rgba(75,59,184,.42);
  }

  /* ── login panel ─────────────────────────────────────── */
  #login{
    max-width:360px;
    margin:52px auto;
    padding:28px 24px 32px;
    text-align:center;
    border-radius:24px;
    border:1px solid rgba(201,184,255,.3);
    background:
      linear-gradient(150deg, rgba(255,255,255,.10), rgba(255,255,255,.015) 46%, rgba(255,255,255,.06)),
      linear-gradient(160deg,#1b1240,#110a2a 70%,#160e34);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 26px 64px rgba(0,0,0,.65),
      0 0 90px rgba(91,62,200,.28);
    backdrop-filter:blur(10px);
  }
  #login input,#login button{width:100%}
  #login input{margin:6px 0}
  #login button{
    margin-top:14px;
    padding:13px;
    font-size:1.02em;
    background:linear-gradient(150deg,#1fbf9a 0%,#0b6b58 55%,#12927a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -3px 8px rgba(0,0,0,.45),
      0 8px 24px rgba(31,191,154,.35);
  }

  /* ── inputs ──────────────────────────────────────────── */
  input{
    padding:11px 13px;
    margin:4px 0;
    border-radius:12px;
    border:1px solid rgba(201,184,255,.28);
    font-family:inherit;
    font-size:1em;
    color:#f3eeff;
    background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.16),
      inset 0 -8px 16px rgba(0,0,0,.3);
    transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder{color:#9487c4}
  input:focus{
    outline:none;
    border-color:rgba(126,240,224,.75);
    box-shadow:
      0 0 0 3px rgba(126,240,224,.14),
      0 0 22px rgba(126,240,224,.22),
      inset 0 1px 0 rgba(255,255,255,.2);
  }
  input[type=file]{
    color:var(--muted);
    font-size:.85em;
    background:none;
    border:none;
    box-shadow:none;
    padding:6px 0;
  }

  #search{
    width:100%;
    padding:14px 16px;
    margin:12px 0;
    font-size:1.05em;
    border-radius:15px;
    border:1px solid rgba(201,184,255,.32);
    background:
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.025)),
      rgba(20,12,48,.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      0 10px 28px rgba(0,0,0,.4);
    backdrop-filter:blur(8px);
  }
  #search:focus{
    outline:none;
    border-color:rgba(126,240,224,.85);
    box-shadow:
      0 0 0 3px rgba(126,240,224,.16),
      0 0 30px rgba(126,240,224,.28),
      inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* ── add bar ─────────────────────────────────────────── */
  #addbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:10px 0;
  }
  #addbar input{width:100%}
  #addbar button{
    grid-column:1/3;
    background:linear-gradient(150deg,#1fbf9a 0%,#0b6b58 55%,#12927a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255
