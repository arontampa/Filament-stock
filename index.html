<style>
  :root{
    --void:#07040f;
    --deep:#120a2c;
    --lilac:#c9b8ff;
    --ice:#bfe9ff;
    --gold:#ffd88a;
    --rose:#ff9ecb;
    --aqua:#7ef0e0;
    --text:#efe9ff;
    --muted:#a99cd8;
  }

  *{box-sizing:border-box}

  body{
    font-family:"Quicksand","Segoe UI",system-ui,sans-serif;
    margin:0;
    padding:14px;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(120vmax 80vmax at 50% -20%, #2a1a5e 0%, transparent 62%),
      radial-gradient(85vmax 62vmax at 108% 108%, #14324a 0%, transparent 58%),
      radial-gradient(72vmax 56vmax at -8% 88%, #3a1350 0%, transparent 60%),
      linear-gradient(170deg,#0a0620 0%,#120a2c 35%,#0c0724 70%,#07040f 100%);
    background-attachment:fixed;
  }

  /* ── starfield ───────────────────────────────────────── */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.6px 1.6px at 22px 34px, #ffffff, transparent 60%),
      radial-gradient(1px 1px at 92px 118px, #cfe8ff, transparent 60%),
      radial-gradient(1.6px 1.6px at 168px 62px, #ffe9b8, transparent 60%),
      radial-gradient(1px 1px at 224px 172px, #ffffff, transparent 60%),
      radial-gradient(1px 1px at 48px 206px, #e0d4ff, transparent 60%),
      radial-gradient(1.4px 1.4px at 268px 22px, #b9e8ff, transparent 60%),
      radial-gradient(1px 1px at 140px 250px, #ffd6ec, transparent 60%),
      radial-gradient(1.2px 1.2px at 292px 268px, #ffffff, transparent 60%),
      radial-gradient(1px 1px at 388px 96px, #ffffff, transparent 60%),
      radial-gradient(1.3px 1.3px at 412px 340px, #d8ccff, transparent 60%),
      radial-gradient(1px 1px at 330px 410px, #ffffff, transparent 60%),
      radial-gradient(1.2px 1.2px at 76px 396px, #ffe9b8, transparent 60%);
    background-size:460px 460px;
    background-repeat:repeat;
    opacity:.55;
    animation:twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle{ from{opacity:.3} to{opacity:.8} }

  /* ── faceted light wash + vignette ───────────────────── */
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      conic-gradient(from 210deg at 15% -5%,
        rgba(255,255,255,.07), transparent 22%,
        rgba(255,158,203,.05) 42%, transparent 58%,
        rgba(126,240,224,.05) 78%, transparent 100%),
      radial-gradient(120% 95% at 50% 45%, transparent 52%, rgba(3,1,10,.6) 100%),
      radial-gradient(1200px 600px at 50% -10%, rgba(201,184,255,.16), transparent 60%),
      radial-gradient(900px 500px at 92% 112%, rgba(126,240,224,.10), transparent 60%);
  }

  #login,#app{position:relative; z-index:1}

  /* ── headings ────────────────────────────────────────── */
  h1{
    font-family:"Cinzel",Georgia,serif;
    font-size:1.25em;
    letter-spacing:.09em;
    margin:.4em 0 .2em;
    background:linear-gradient(92deg,#ffd88a 0%,#c9b8ff 34%,#7ef0e0 66%,#ff9ecb 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 14px rgba(201,184,255,.35));
  }
  h1::before,h1::after{
    color:var(--gold);
    font-size:.75em;
    vertical-align:middle;
    margin:0 .4em;
    opacity:.85;
  }
  h1::before{content:"✦"}
  h1::after{content:"✦"}

  h3{
    font-family:"Cinzel",Georgia,serif;
    font-size:.86em;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--lilac);
    margin:22px 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(201,184,255,.18);
    text-shadow:0 0 16px rgba(201,184,255,.35);
  }

  /* ── gem buttons ─────────────────────────────────────── */
  button{
    position:relative;
    overflow:hidden;
    padding:11px 16px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:13px;
    font-family:inherit;
    font-size:1em;
    font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    cursor:pointer;
    margin:4
