<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<title>Zodiac Shadows Inventory</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body{font-family:sans-serif;background:#1a1a2e;color:#eee;margin:0;padding:12px}
  h1{font-size:1.2em}
  h3{color:#c9b8ff}
  button{padding:10px 14px;border:none;border-radius:8px;font-size:1em;cursor:pointer;margin:4px 2px}
  .blue{background:#0f3460;color:#fff}
  #search{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:1.05em}
  #login{max-width:340px;margin:40px auto;text-align:center}
  #login input,#login button{width:100%}
  #login input{padding:12px;margin:4px 0;border-radius:8px;border:none;font-size:1em}
  #login button{background:#4caf50;color:#fff;padding:12px;font-weight:bold;margin-top:8px}
  input{padding:10px;margin:4px 0;border-radius:6px;border:none}
  #addbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  #addbar input{width:100%;box-sizing:border-box}
  #addbar button{grid-column:1/3;background:#4caf50;color:#fff}
  .item{display:flex;align-items:center;gap:10px;padding:12px 10px;margin:6px 0;border-radius:8px;background:#16213e}
  .item.out{background:#5c1f1f;border:2px solid #f44336}
  .item.multi{background:#1d4a24;border:2px solid #4caf50}
  .item .name{flex:1;font-weight:bold}
  .item.out .name::after{content:'  ⛔ OUT';color:#ff8a80;font-size:.8em}
  .item.multi .name::after{content:'  ✅ STOCKED';color:#a5d6a7;font-size:.8em}
  .qty{font-size:1.4em;font-weight:bold;min-width:34px;text-align:center}
  .pm{background:rgba(0,0,0,.35);color:#fff;padding:8px 16px;font-size:1.1em}
  .del{background:rgba(0,0,0,.35);border:1px solid #f44336;color:#ff8a80;padding:8px 10px;border-radius:8px;font-size:1em}
  .hdr{background:#0f3460;padding:6px 10px;border-radius:6px;margin-top:12px;font-weight:bold}
  #user{font-size:.8em;color:#8892b0;text-align:center;margin-bottom:6px}
  p{color:#8892b0;text-align:center}
  input[type=file]{color:#8892b0;font-size:.85em}
  @media(min-width:768px){
    body{max-width:960px;margin:0 auto}
    #inventory{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;align-items:start}
    h1{font-size:1.6em}
  }
</style>
</head>
<body>
<div id="login">
  <h1>🌑 Zodiac Shadows Inventory</h1>
  <p>Sign in to sync</p>
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Sign In</button>
</div>
<div id="app" style="display:none">
  <h1>🌑 Zodiac Shadows Inventory</h1>
  <div id="user"></div>
  <input id="search" type="text" placeholder="🔍 Search brand or color..." oninput="render()">
  <h3>Inventory (<span id="count">0</span> shown)</h3>
  <div id="inventory"><div id="list"></div></div>
  <h3>Add Manually</h3>
  <div id="addbar">
    <input id="nBrand" type="text" placeholder="Brand">
    <input id="nColor" type="text" placeholder="Color name">
    <button onclick="addItem()">Add Item</button>
  </div>
  <h3>Tools</h3>
  <input type="file" accept=".csv" onchange="importCSV(event)">
  <br>
  <button class="blue" onclick="shareList()">📤 Share List</button>
  <button class="blue" onclick="exportCSV()">💾 Backup CSV</button>
  <button class="blue" onclick="logout()">🔒 Sign Out</button>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdQORg8wG4WHIEXj5w9l4TAZUnxtR3Wxk",
  authDomain: "filament-stock-43efd.firebaseapp.com",
  databaseURL: "https://filament-stock-43efd-default-rtdb.firebaseio.com",
  projectId: "filament-stock-43efd",
  storageBucket: "filament-stock-43efd.firebasestorage.app",
  messagingSenderId: "427072456191",
  appId: "1:427072456191:web:a38213af5e088f49bed3ca"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const fdb = firebase.database();
const ROOT = fdb.ref('filament');

let db = JSON.parse(localStorage.getItem('fil') || '{}');
const cache = () => localStorage.setItem('fil', JSON.stringify(db));
const keyOf = (b,c) => 'FT|' + b.trim() + '|' + c.trim();
const safeKey = k => k.replace(/[.#$$$$$\/]/g, '_');
function status(q){ return q==0 ? 'out' : (q>=2 ? 'multi' : ''); }

function login(){
  auth.signInWithEmailAndPassword(email.value, pass.value)
    .catch(e => alert('Login failed: ' + e.message));
}
function logout(){ auth.signOut(); }

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('user').textContent = 'Synced as: ' + user.email;
    ROOT.on('value', snap => {
      const remote = snap.val() || {};
      db = {};
      for(const k in remote) db[k] = remote[k];
      cache(); render();
    });
  } else {
    document.getElementById('login').style.display='block';
    document.getElementById('app').style.display='none';
    ROOT.off();
  }
});

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('list');
  const keys = Object.keys(db)
    .filter(k => !q || (db[k].brand + ' ' + db[k].color).toLowerCase().includes(q))
    .sort((a,b)=>{
      const ba = db[a].brand.toLowerCase(), bb = db[b].brand.toLowerCase();
      if(ba !== bb) return ba.localeCompare(bb);
      return db[a].color.localeCompare(db[b].color);
    });
  document.getElementById('count').textContent = keys.length;
  let lastBrand = '', html = '';
  keys.map(k=>{
    const i = db[k];
    const ek = k.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    if(i.brand !== lastBrand){ lastBrand = i.brand; html += `<div class="hdr">${i.brand}</div>`; }
    html += `<div class="item ${status(i.qty)}">
      <div class="name">${i.color}</div>
      <button class="pm" onclick="chg('${ek}',-1)">−</button>
      <span class="qty">${i.qty}</span>
      <button class="pm" onclick="chg('${ek}',1)">+</button>
      <button class="del" onclick="removeItem('${ek}')">🗑️</button>
    </div>`;
  });
  list.innerHTML = html || '<p>' + (q ? 'No matches for "' + q + '"' : 'Nothing tracked yet. Import your CSV!') + '</p>';
}

function chg(k,n){
  const q = Math.max(0, db[k].qty + n);
  ROOT.child(safeKey(k) + '/qty').set(q);
}

function removeItem(k){
  const i = db[k];
  if(confirm('Remove ' + i.brand + ' — ' + i.color + ' from tracking?')){
    ROOT.child(safeKey(k)).remove();
  }
}

function addItem(){
  const b = nBrand.value.trim(), c = nColor.value.trim();
  if(!b || !c){ alert('Need both a brand and a color name.'); return; }
  const k = keyOf(b, c);
  if(db[k]){ alert('Already tracking ' + b + ' — ' + c + '.'); return; }
  ROOT.child(safeKey(k)).set({brand:b, color:c, qty:0});
  nBrand.value = ''; nColor.value = '';
}

function importCSV(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let added = 0, skipped = 0;
    r.result.split('\n').slice(1).forEach(line=>{
      const cols = line.split(',').map(s=>s.trim().replace(/"/g,''));
      const brand = cols[0], color = cols[1], qty = parseInt(cols[2]) || 0;
      if(!brand || !color) return;
      const k = keyOf(brand, color);
      if(db[k]){ skipped++; }
      else {
        ROOT.child(safeKey(k)).set({brand, color, qty: qty});
        added++;
      }
    });
    alert(added + ' new item(s) added with their CSV quantities. ' + skipped + ' existing kept as-is.');
  };
  r.readAsText(f);
}

function makeCSV(){
  let csv = 'Brand,Color,Qty\n';
  for(const k in db) csv += `"${db[k].brand}","${db[k].color}",${db[k].qty}\n`;
  return csv;
}

function exportCSV(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([makeCSV()],{type:'text/csv'}));
  a.download = 'filament_backup.csv'; a.click();
}

async function shareList(){
  const file = new File([makeCSV()], 'filament_list.csv', {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({files:[file], title:'Zodiac Shadows Inventory'});
  } else {
    await navigator.clipboard.writeText(makeCSV());
    alert('CSV copied to clipboard.');
  }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
